[project]
name = "applied-ai-lab"
version = "0.1.0"
description = "Senior-engineer-meets-applied-AI: production-shaped patterns for LLM apps, RAG, MCP, and agentic systems."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.45.0",
    "python-dotenv>=1.0.1",
    # Phase 3.2 — RAG
    "chromadb>=0.5.0",          # vector DB w/ default embedding fn (ONNX, no torch)
    # Phase 4 capstone — API + observability
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # Phase 4c — event-driven ingest
    "kafka-python-ng>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
