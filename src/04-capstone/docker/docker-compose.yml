services:
  # --------------------------------------------------------------- Kafka
  # KRaft mode (no Zookeeper). Single broker for the demo.
  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------- Trace backend
  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ------------------------------------------------------- API + agent + UI
  api:
    build:
      context: ../../..
      dockerfile: src/04-capstone/docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../../.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      TELEMETRY_DB: /data/telemetry.sqlite
    volumes:
      - telemetry-data:/data
    depends_on:
      - jaeger
      - kafka

  # ------------------------------------------------------- Synthetic producer
  producer:
    build:
      context: ../../..
      dockerfile: src/04-capstone/docker/Dockerfile
    working_dir: /app/src/04-capstone
    command: ["uv", "run", "python", "-m", "kafka.producer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PRODUCE_INTERVAL_SECONDS: "5"
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------- Ingest worker
  ingest:
    build:
      context: ../../..
      dockerfile: src/04-capstone/docker/Dockerfile
    working_dir: /app/src/04-capstone
    command: ["uv", "run", "python", "-m", "kafka.consumer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TELEMETRY_DB: /data/telemetry.sqlite
    volumes:
      - telemetry-data:/data
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  telemetry-data:
