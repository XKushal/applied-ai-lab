services:
  api:
    build:
      context: ../../..    # the project root (so the build can see all of src/)
      dockerfile: src/04-capstone/docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../../.env       # ANTHROPIC_API_KEY lives here
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      - jaeger

  # all-in-one Jaeger — collector + UI + storage. Hit the UI at http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "16686:16686"      # web UI
      - "4317:4317"        # OTLP gRPC collector
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
